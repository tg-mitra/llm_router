[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Prompt classification and LLM model selection library for agentic AI systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Tathagata Mitra", email = "tathagata.mitra@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sentence-transformers==6.0.1",
    "scikit-learn==1.9.0",
    "numpy>=1.26,<3",
    "PyYAML==6.0.3",
    "joblib==1.6.0",
]

[project.optional-dependencies]
huggingface = [
    "huggingface-hub==1.30.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
]

[project.urls]
Homepage = "https://github.com/tathagatamitra/model_router"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
